name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Draft GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: opencode-doctor ${{ github.ref_name }}
          body: |
            ## opencode-doctor ${{ github.ref_name }}

            Health checks for your opencode setup with `--fix` repairs.

            Install:
            ```bash
            curl -fsSLO https://github.com/kiraadityaa/opencode-doctor/releases/latest/download/doctor.sh
            chmod +x doctor.sh
            ./doctor.sh
            ```
          files: |
            doctor.sh
          draft: true